<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1312">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gringo Calc">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gringo Calc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <div class="ornament ornament-left" aria-hidden="true"></div>
        <div class="ornament ornament-right" aria-hidden="true"></div>

        <header class="app-header">
            <div class="brand-mark" aria-hidden="true">
                <span>₡</span>
                <span>$</span>
            </div>
            <div class="title-wrap">
                <p class="eyebrow">Gringo Studios</p>
                <h1>Gringo Calc</h1>
            </div>
        </header>

        <main class="container" aria-label="Currency calculator">
            <div class="field-group">
                <label for="crc">CRC</label>
                <input id="crc" type="text" inputmode="decimal" placeholder="0">
            </div>

            <div class="field-group">
                <label for="rate">Exchange Rate <span id="inverseRateLabel" class="inverse-rate-label"></span></label>
                <input id="rate" type="number" step="0.0001" placeholder="0.00">
            </div>

            <div class="field-group">
                <label for="usd">USD</label>
                <input id="usd" type="number" step="0.000001" placeholder="0.00">
            </div>

            <button id="clearBtn" type="button">Clear</button>

            <div id="numberWords" class="number-words" lang="es" aria-live="polite"></div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .catch((error) => {
                        console.warn("Service worker registration failed:", error);
                    });
            });
        }
    </script>
</body>
</html>
