<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f3b5b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gringo Calc">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Gringo Calc</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
    <h1>Gringo Calc</h1>
    <div class="container">
        <label>CRC</label>
        <input id="crc" type="text" inputmode="decimal">
        <label>Exchange Rate <span id="inverseRateLabel" class="inverse-rate-label"></span></label>
        <input id="rate" type="number" step="0.0001">
        <label>USD</label>
        <input id="usd" type="number" step="0.000001">
        <button id="clearBtn">Clear</button>
        <div id="numberWords" class="number-words"></div>
    </div></div>
    <script src="app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .catch((error) => {
                        console.warn("Service worker registration failed:", error);
                    });
            });
        }
    </script>
</body>
</html>
